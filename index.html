<!DOCTYPE html>
<html>
<head>
  <title>Kompa One Click Studio</title>

  <style>
    body {
      background: black;
      color: white;
      font-family: Arial;
      text-align: center;
      padding: 50px;
    }

    input, select, button {
      padding: 15px;
      margin: 10px;
      width: 320px;
      border-radius: 10px;
      border: none;
      font-size: 16px;
    }

    button {
      background: purple;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .box {
      background: #111;
      padding: 20px;
      border-radius: 10px;
      margin: 15px auto;
      width: 80%;
      max-width: 600px;
    }

    audio, video {
      width: 100%;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<h1>Kompa One Click Studio</h1>

<input id="topic" placeholder="Enter Topic"><br>

<select id="beat">
  <option>Romantic Kompa</option>
  <option>Party Kompa</option>
  <option>Gospel Kompa</option>
  <option>Carnival Kompa</option>
</select><br>

<button onclick="generate()">Create Song + Video</button>

<div id="output"></div>

<script>
async function generate() {

  let topic = document.getElementById("topic").value;
  let beat = document.getElementById("beat").value;

  if (!topic) {
    alert("Enter a topic");
    return;
  }

  document.getElementById("output").innerHTML =
    "<div class='box'>⏳ Creating your song + video...</div>";

  try {

    let res = await fetch("/api/generate", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ topic, beat })
    });

    let data = await res.json();

    document.getElementById("output").innerHTML =

      "<div class='box'><b>🎤 Lyrics</b><br><br>" + data.lyrics + "</div>" +

      "<div class='box'><b>🎵 Song</b><br>" +
      "<audio controls src='" + data.musicUrl + "'></audio></div>" +

      "<div class='box'><b>🎬 Video</b><br>" +
      "<video controls src='" + data.videoUrl + "'></video></div>";

  } catch (err) {
    document.getElementById("output").innerHTML =
      "<div class='box'>❌ Error connecting to server</div>";
  }
}
</script>

</body>
</html>
