<!DOCTYPE html>
<html>
<head>
  <title>Kompa One Click Studio</title>
  <style>
    body { background:#000; color:#fff; font-family:Arial; text-align:center; padding:40px; }
    input, select, button {
      padding:14px; margin:10px; width:320px; border-radius:10px; border:none;
    }
    button { background:purple; color:#fff; font-weight:bold; cursor:pointer; }
    .box { background:#111; padding:15px; margin:15px auto; width:80%; border-radius:10px; }
    .copy { background:#333; padding:8px; cursor:pointer; margin-top:10px; display:inline-block; }
  </style>
</head>

<body>

<h1>Kompa One Click Studio</h1>

<input id="topic" placeholder="Enter Topic"><br>

<select id="beat">
  <option>Romantic Kompa</option>
  <option>Party Kompa</option>
  <option>Gospel Kompa</option>
  <option>Carnival Kompa</option>
</select><br>

<button onclick="generate()">Create Song + Video</button>

<div id="output"></div>

<script>
function copy(text) {
  navigator.clipboard.writeText(text);
  alert("Copied!");
}

function generate() {
  let topic = document.getElementById("topic").value;
  let beat = document.getElementById("beat").value;

  if (!topic) {
    alert("Enter a topic");
    return;
  }

  let musicPrompt =
    "Haitian kompa song in Haitian Creole about " + topic +
    ", " + beat +
    ", male and female vocals, smooth groove, live band, modern kompa";

  let videoPrompt =
    "Haitian kompa band, 5 male musicians and 1 female singer, performing a song about " +
    topic + ", " + beat + ", cinematic lighting, studio performance";

  document.getElementById("output").innerHTML =

  "<div class='box'><b>🎵 MUSIC PROMPT</b><br>" + musicPrompt +
  "<div class='copy' onclick='copy(`" + musicPrompt + "`)'>Copy</div></div>" +

  "<div class='box'><b>🎬 VIDEO PROMPT</b><br>" + videoPrompt +
  "<div class='copy' onclick='copy(`" + videoPrompt + "`)'>Copy</div></div>" +

  "<div class='box'>" +
  "<button onclick='window.open(\"https://suno.com\", \"_blank\")'>Open Suno</button><br><br>" +
  "<button onclick='window.open(\"https://app.runwayml.com\", \"_blank\")'>Open Runway</button>" +
  "</div>";
}
</script>

</body>
</html>
