<script>
function generate() {

  let topic = document.getElementById("topic").value;
  let beat = document.getElementById("beat").value;

  if (topic.trim() === "") {
    alert("⚠️ Please enter a topic");
    return;
  }

  // Build prompts
  let musicPrompt =
    "Haitian kompa song in Haitian Creole about " + topic +
    ", " + beat +
    ", male and female vocals, romantic, live band instruments, modern kompa style";

  let videoPrompt =
    "Haitian kompa band performing live, 5 male musicians and 1 female singer, song about " +
    topic + ", " + beat +
    ", cinematic lighting, studio performance, professional music video";

  // Open MUSIC generator (Suno)
  window.open(
    "https://suno.com/create?prompt=" + encodeURIComponent(musicPrompt),
    "_blank"
  );

  // Open VIDEO generator (Runway)
  window.open(
    "https://app.runwayml.com/",
    "_blank"
  );

  // Show confirmation on your page
  document.getElementById("output").innerHTML =
    "<div class='box'>✅ Music + Video tools opened</div>" +
    "<div class='box'>👉 Your topic: <b>" + topic + "</b></div>" +
    "<div class='box'>👉 Beat: <b>" + beat + "</b></div>" +
    "<div class='box'>👉 Suno = paste music prompt<br>👉 Runway = paste video prompt</div>";
}
</script>
